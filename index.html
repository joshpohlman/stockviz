<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/stockviz/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Finviz-style stock screener with pattern prediction, technical signals, heat maps, and real-time data." />
    <title>StockViz — Stock Screener & Pattern Prediction</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="/stockviz/assets/index-WNuEcyaE.js"></script>
    <link rel="stylesheet" crossorigin href="/stockviz/assets/index-DddWqfwm.css">
  </head>
  <body>
    <div id="app">
      <header class="site-header finviz-header">
        <div class="header-inner">
          <a href="#/" class="logo">
            <span class="logo-mark">SV</span>
            <span class="logo-text">Stock<span class="accent">Viz</span></span>
          </a>
          <button class="nav-toggle" id="nav-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
          <nav class="main-nav finviz-nav" aria-label="Main">
            <a href="#/">Home</a>
            <a href="#/dashboard">Dashboard</a>
            <a href="#/news">News</a>
            <a href="#/screener">Screener</a>
            <a href="#/charts">Charts</a>
            <a href="#/multicharts">Multi-Chart</a>
            <a href="#/map">Map</a>
            <a href="#/groups">Groups</a>
            <a href="#/portfolio">Portfolio</a>
            <a href="#/insider">Insider</a>
            <a href="#/signals">Signals</a>
            <a href="#/patterns">Patterns</a>
            <a href="#/futures">Futures</a>
            <a href="#/calendar">Calendar</a>
            <a href="#/compare">Compare</a>
            <a href="#/internals">Internals</a>
            <a href="#/rotation">Rotation</a>
            <a href="#/correlation">Correlation</a>
            <a href="#/backtest">Backtest</a>
            <a href="#/options">Options</a>
            <a href="#/analyst">Analyst</a>
            <a href="#/shorts">Shorts</a>
            <a href="#/alerts">Alerts</a>
            <a href="#/export">Export</a>
            <a href="#/settings">Settings</a>
          </nav>
          <div class="header-actions">
            <a href="#/alerts" class="alert-btn" id="alert-btn" title="Alerts">
              <span>🔔</span><span class="alert-badge" id="alert-badge" hidden>0</span>
            </a>
            <button class="search-btn" id="search-btn" title="Search"><span>⌕</span><kbd>/</kbd></button>
            <button class="theme-btn" id="theme-toggle" title="Theme">◐</button>
          </div>
          <div class="header-status">
            <span class="market-status" id="market-status"></span>
            <span class="status-dot" id="status-dot"></span>
            <span class="status-text" id="status-text">Loading…</span>
            <span class="last-update" id="last-update"></span>
          </div>
        </div>
      </header>
      <div class="ticker-bar" id="ticker-bar"></div>
      <main class="main-content finviz-main" id="main-content"></main>
      <footer class="site-footer">
        <span>StockViz · Pattern Prediction Engine</span>
        <span id="footer-stats"></span>
        <span><a href="https://github.com/joshpohlman/stockviz" target="_blank" rel="noopener">GitHub</a></span>
      </footer>
      <aside class="quote-panel" id="quote-panel" hidden>
        <button class="quote-close" id="quote-close">&times;</button>
        <div id="quote-panel-body"></div>
      </aside>
      <div class="quote-overlay" id="quote-overlay" hidden></div>
      <div class="cmd-overlay" id="cmd-overlay" hidden></div>
      <div class="command-palette" id="command-palette" hidden>
        <input type="search" id="cmd-input" placeholder="Search ticker…" autocomplete="off" />
        <div id="cmd-results" class="cmd-results"></div>
      </div>
      <div id="toast-root" class="toast-root"></div>
    </div>
    <script>document.getElementById('search-btn')?.addEventListener('click',()=>window.dispatchEvent(new KeyboardEvent('keydown',{key:'k',ctrlKey:true})));</script>
  </body>
</html>
